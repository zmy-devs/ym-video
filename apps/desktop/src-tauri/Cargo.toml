[package]
name = "ym-video"
version = "6.1.6"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ym_video_core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "json"] }
reqwest_cookie_store = "0.9"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
cookie_store = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
