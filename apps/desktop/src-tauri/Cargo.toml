[package]
name = "ym-video"
version = "6.1.6"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ym_video_core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["devtools"] }
ym-video-native-core = { path = "../../../packages/native-core" }
serde_json = "1"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-opener = "2"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
