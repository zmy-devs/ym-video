[package]
name = "ym-video-mobile"
publish = false
edition = "2021"
rust-version = "1.90"

[lib]
name = "ym_video_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
ym-video-native-core = { path = "../../../packages/native-core" }
serde_json = "1"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-mobile-controls = { path = "../../../packages/mobile-controls" }
tauri-plugin-upload = "=2.5.0"
tauri-plugin-android-installer = "=0.1.0"
