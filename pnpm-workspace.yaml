packages:
  - apps/*
  - packages/*

# 各应用仅链接自身声明的依赖，实际文件复用根目录的 node_modules/.pnpm 存储。
nodeLinker: isolated

# 所有应用和共享包共用根锁文件。
sharedWorkspaceLockfile: true

# 从原桌面端迁入，暂不调整已有的依赖覆盖规则。
overrides:
  'app-builder-lib>@electron/get': 3.1.0
  node-abi: latest

# 集中管理工作区构建脚本许可。
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  workerd: true
  vue-demi: true
  better-sqlite3: false
  '@parcel/watcher': false
  # 移动原生模块随 Expo 原生工程构建，使用包中已有的 JavaScript 产物。
  react-native-mmkv: false
  react-native-nitro-modules: false
